version: '3.8'

services:
  backend:
    build: ./backend
    container_name: expense_tracker_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always
  frontend:
    build: ./frontend/expense-tracker
    container_name: expense_tracker_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always